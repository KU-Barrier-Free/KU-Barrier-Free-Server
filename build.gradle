plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

// 전역적으로 JAI 관련 종속성 제외
configurations.all {
	exclude group: 'javax.media', module: 'jai_core'
	exclude group: 'javax.media', module: 'jai_codec'
	exclude group: 'javax.media', module: 'jai_imageio'
}

ext {
	geotoolsVersion = '33.1'
}

repositories {
	mavenCentral()
	maven {
		url "https://repo.osgeo.org/repository/release/"
	}
	maven {
		url "https://repo.osgeo.org/repository/snapshot/"
	}
}

dependencies {

	// Web
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// JDBC
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	// Devtools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spatial
	implementation 'org.hibernate:hibernate-spatial:6.6.15.Final'
	implementation 'org.locationtech.jts:jts-core:1.20.0'

	// GeoTools
	implementation "org.geotools:gt-shapefile:${geotoolsVersion}"
	implementation "org.geotools:gt-epsg-hsql:${geotoolsVersion}"
	implementation "org.geotools:gt-swing:${geotoolsVersion}"
	implementation "org.geotools:gt-referencing:${geotoolsVersion}"
	implementation "org.geotools:gt-epsg-extension:${geotoolsVersion}"

	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// Health Check
	implementation("org.springframework.boot:spring-boot-starter-actuator")

	// Jsoup
	implementation 'org.jsoup:jsoup:1.21.1'
}

tasks.named('test') {
	useJUnitPlatform()
}
