spring:
  profiles:
    group:
      test: common
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 150MB