name: KU-Barrier-Free CD with Gradle and Docker

on:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'deploy/#29-ci-cd'
  pull_request:
    branches:
      - 'develop'
      - 'main'
      - 'deploy/#29-ci-cd'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: ☕️ set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          setting-path: ${{ github.workspace }}

      - name: 👏🏻 grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🐘 build with Gradle (without test)
        run: ./gradlew clean build -x test --stacktrace

      - name: 🐳 Docker build & push
        run:  |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile-prod -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}

      - name: 🚀 deploy to prod-server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: GITHUB_SHA
          script: |
            echo "✋🏻Stopping existing container"
            sudo docker stop kubf
            sudo docker rm kubf
        
            sudo docker ps -a
            
            echo "🥳Pulling new image"
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}

            echo "🌱Setting environment variables"
            export PROD_DATASOURCE_URL=${{ secrets.PROD_DATASOURCE_URL }}
            export PROD_DATASOURCE_USERNAME=${{ secrets.PROD_DATASOURCE_USERNAME }}
            export PROD_DATASOURCE_PASSWORD=${{ secrets.PROD_DATASOURCE_PASSWORD }}

            echo "🌱Running new container"
            sudo docker run -d -p 9002:9002 --name kubf \
              -e PROD_DATASOURCE_URL=$PROD_DATASOURCE_URL \
              -e PROD_DATASOURCE_USERNAME=$PROD_DATASOURCE_USERNAME \
              -e PROD_DATASOURCE_PASSWORD=$PROD_DATASOURCE_PASSWORD \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} \
              java -jar -Dspring.profiles.active=prod app.jar

            echo "🚮Cleaning up old images"
            sudo docker image prune -f
