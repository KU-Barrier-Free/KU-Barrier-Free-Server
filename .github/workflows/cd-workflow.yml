name: KU-Barrier-Free CD with Gradle and Docker

on:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'deploy/#29-ci-cd'
  pull_request:
    branches:
      - 'develop'
      - 'main'
      - 'deploy/#29-ci-cd'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: ☕️ set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          setting-path: ${{ github.workspace }}

      - name: 👏🏻 grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🐘 build with Gradle (without test)
        run: ./gradlew clean build -x test --stacktrace

      - name: 🐳 Docker image build & push
        run:  |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile-prod -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}

      - name: 🚀 deploy to prod-server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: GITHUB_SHA
          script: |
            echo "📦 Checking current container"
            CURRENT_CONTAINER=$(sudo docker ps -q -f name=kubf-green)

            if [ -z "$CURRENT_CONTAINER" ]; then
              NEW_CONTAINER="kubf-green"
              OLD_CONTAINER="kubf-blue"
              NEW_PORT=9003
            else
              NEW_CONTAINER="kubf-blue"
              OLD_CONTAINER="kubf-green"
              NEW_PORT=9002
            fi

            echo "🟢 NEW_CONTAINER: $NEW_CONTAINER"
            echo "⚫️ OLD_CONTAINER: $OLD_CONTAINER"
            echo "📦 NEW_PORT: $NEW_PORT"
            
            echo "🐳 Pulling latest Docker image from DockerHub"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}
            
            echo "🛑 Stopping old container: $OLD_CONTAINER"
            docker stop $OLD_CONTAINER || true
          
            echo "🚀 Starting new container: $NEW_CONTAINER"
            docker run -d --name $NEW_CONTAINER -p $NEW_PORT:9002 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e PROD_DATASOURCE_URL=${{ secrets.PROD_DATASOURCE_URL }} \
              -e PROD_DATASOURCE_USERNAME=${{ secrets.PROD_DATASOURCE_USERNAME }} \
              -e PROD_DATASOURCE_PASSWORD=${{ secrets.PROD_DATASOURCE_PASSWORD }} \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}
            
            echo "🧪 Waiting for $NEW_CONTAINER to pass health check"
            for i in {1..10}; do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$NEW_PORT/actuator/health || true)
              echo "Health check status: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed!"
                echo "📝 Updating Nginx config to point to port $NEW_PORT"
                echo "proxy_pass http://localhost:$NEW_PORT;" > /tmp/proxy_pass_line
                sed -i '/proxy_pass/c\\t\tproxy_pass http://localhost:'"$NEW_PORT"';' /etc/nginx/conf.d/app.conf
                sudo nginx -t && sudo systemctl reload nginx
                break
              fi
              if [ "$i" = "10" ]; then
                echo "❌ Health check failed after multiple attempts"
                docker stop $NEW_CONTAINER && docker rm $NEW_CONTAINER || true
                exit 1
              fi
            done

            echo "🚮 Cleaning up unused Docker images"
            sudo docker image prune -f

      - name: 📤 Copy Nginx config to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: nginx/app.conf
          target: /tmp/

      - name: 🛠 Move Nginx config into place and reload
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sudo mv /tmp/app.conf /etc/nginx/conf.d/app.conf
            sudo nginx -t && sudo systemctl reload nginx
