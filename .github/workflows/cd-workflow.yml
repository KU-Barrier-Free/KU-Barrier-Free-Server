name: KU-Barrier-Free CD with Gradle and Docker

on:
  push:
    branches:
      - 'develop'
      - 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ☕️ set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          setting-path: ${{ github.workspace }}

      - name: 👏🏻 grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🐘 build with Gradle (without test)
        run: ./gradlew clean build -x test --stacktrace

      - name: 🐳 Docker image build & push
        run:  |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile-prod -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}

      - name: 🚀 deploy to prod-server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: GITHUB_SHA
          script: |
            echo "📦 Checking current container"
            source ~/choose_container.sh
            
            echo "🟢 NEW_CONTAINER: $NEW_CONTAINER"
            echo "⚫️ OLD_CONTAINER: $OLD_CONTAINER"
            echo "📦 NEW_PORT: $NEW_PORT"
            
            echo "🐳 Pulling latest Docker image from DockerHub"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}
          
            echo "🚀 Starting new container: $NEW_CONTAINER"
            docker run -d --name $NEW_CONTAINER -p $NEW_PORT:9002 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e PROD_DATASOURCE_URL=${{ secrets.PROD_DATASOURCE_URL }} \
              -e PROD_DATASOURCE_USERNAME=${{ secrets.PROD_DATASOURCE_USERNAME }} \
              -e PROD_DATASOURCE_PASSWORD=${{ secrets.PROD_DATASOURCE_PASSWORD }} \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}
            
            echo "🧪 Waiting for $NEW_CONTAINER to pass health check"
            bash ~/health_check.sh $NEW_PORT $NEW_CONTAINER $OLD_CONTAINER
            
            echo "📝 Updating Nginx config to point to port $NEW_PORT"
            echo "proxy_pass http://localhost:$NEW_PORT;" > /tmp/proxy_pass_line
            sudo sed -i '/proxy_pass/c\\t\tproxy_pass http://localhost:'"$NEW_PORT"';' /etc/nginx/conf.d/app.conf
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "🚮 Clean up old container"
            sudo docker stop $OLD_CONTAINER || true
            sudo docker rm $OLD_CONTAINER || true
            sudo docker image prune -a -f
