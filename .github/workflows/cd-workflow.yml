name: KU-Barrier-Free CD with Gradle and Docker

on:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'deploy/#29-ci-cd'
  pull_request:
    branches:
      - 'develop'
      - 'main'
      - 'deploy/#29-ci-cd'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: ☕️ set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          setting-path: ${{ github.workspace }}

      - name: 👏🏻 grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🐘 build with Gradle (without test)
        run: ./gradlew clean build -x test --stacktrace

      - name: 🐳 Docker build & push
        run:  |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile-prod -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}

      - name: 🚀 deploy to prod-server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: GITHUB_SHA
          script: |
            echo "📦 Checking current container"
            CURRENT_CONTAINER=$(sudo docker ps -q -f name=kubf-green)

            if [ -z "$CURRENT_CONTAINER" ]; then
              NEW_CONTAINER="kubf-green"
              OLD_CONTAINER="kubf-blue"
              NEW_PORT=9003
            else
              NEW_CONTAINER="kubf-blue"
              OLD_CONTAINER="kubf-green"
              NEW_PORT=9002
            fi

            echo "🥳 Pulling latest Docker image (built via compose)"
            cd ~/app-directory  # adjust path as needed
            echo "🛑 Stopping existing container (if any)"
            docker-compose -f docker-compose.yml down || true

            echo "🚀 Starting containers with docker-compose.yml"
            docker-compose -f docker-compose.yml up -d --build

            echo "🧪 Waiting for $NEW_CONTAINER to pass health check"
            for i in {1..10}; do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$NEW_PORT/actuator/health || true)
              echo "Health check status: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed!"
                echo "🔁 Switching traffic to $NEW_CONTAINER target group"
                if [ "$NEW_CONTAINER" = "kubf-green" ]; then
                  NEW_TG_ARN=${{ secrets.GREEN_TG_ARN }}
                else
                  NEW_TG_ARN=${{ secrets.BLUE_TG_ARN }}
                fi

                aws elbv2 modify-listener \
                  --region ap-northeast-2 \
                  --listener-arn ${{ secrets.LISTENER_ARN }} \
                  --default-actions Type=forward,TargetGroupArn=$NEW_TG_ARN
                break
              fi
              if [ "$i" = "10" ]; then
                echo "❌ Health check failed after multiple attempts"
                docker-compose -f docker-compose.yml down || true
                exit 1
              fi
            done

            echo "🚮 Cleaning up unused Docker images"
            sudo docker image prune -f
